name: Validate TerraCore engine

on:
  push:
    branches:
      - main
    paths:
      - "terracore_engine.py"
      - "appsheet_integration.py"
      - "app_surcos_VIDEO_V10.py"
      - "requirements_worker.txt"
      - ".github/workflows/validate-terracore-engine.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terracore_engine.py"
      - "appsheet_integration.py"
      - "requirements_worker.txt"
      - ".github/workflows/validate-terracore-engine.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate headless OpenCV engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_worker.txt

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_worker.txt

      - name: Compile and import TerraCore modules
        run: |
          python -m py_compile terracore_engine.py appsheet_integration.py run_appsheet_job.py app_surcos_VIDEO_V10.py
          python - <<'PY'
          import os
          import terracore_engine
          import appsheet_integration as integration
          from appsheet_integration import (
              _apply_inventory_record_edits,
              appsheet_process_analysis,
          )
          from PIL import Image
          import json

          class FakeRequest:
              def __init__(self, result):
                  self.result = result

              def execute(self):
                  return self.result

          class FakeValues:
              def __init__(self):
                  self.append_calls = 0
                  self.appended_rows = []

              def get(self, **kwargs):
                  return FakeRequest({"values": [["ZonaID", "AnalisisID", "NombreZona"]]})

              def append(self, **kwargs):
                  self.append_calls += 1
                  self.appended_rows = kwargs["body"]["values"]
                  first = 2
                  last = first + len(self.appended_rows) - 1
                  return FakeRequest({
                      "updates": {
                          "updatedRange": f"'ZonasDañadas'!A{first}:C{last}"
                      }
                  })

          class FakeSpreadsheetResource:
              def __init__(self):
                  self.fake_values = FakeValues()

              def get(self, **kwargs):
                  return FakeRequest({
                      "sheets": [{
                          "properties": {
                              "title": "ZonasDañadas",
                              "sheetId": 1,
                              "gridProperties": {"rowCount": 1000, "columnCount": 26},
                          }
                      }]
                  })

              def values(self):
                  return self.fake_values

          class FakeSheets:
              def __init__(self):
                  self.resource = FakeSpreadsheetResource()

              def spreadsheets(self):
                  return self.resource

          fake_sheets = FakeSheets()
          old_spreadsheet_id = integration.SPREADSHEET_ID
          integration.SPREADSHEET_ID = "test-spreadsheet"
          try:
              zone_records = [
                  {
                      "ZonaID": f"zona-{index}",
                      "AnalisisID": "analisis-prueba",
                      "NombreZona": f"Zona dañada {index}",
                  }
                  for index in range(100)
              ]
              first_result = integration._append_rows_once(
                  fake_sheets,
                  "ZonasDañadas",
                  zone_records,
                  "ZonaID",
              )
              second_result = integration._append_rows_once(
                  fake_sheets,
                  "ZonasDañadas",
                  zone_records,
                  "ZonaID",
              )
              assert fake_sheets.resource.fake_values.append_calls == 1
              assert len(fake_sheets.resource.fake_values.appended_rows) == 100
              assert first_result == list(range(2, 102))
              assert second_result == first_result
          finally:
              integration.SPREADSHEET_ID = old_spreadsheet_id


          required = [
              "_ocv2_analyze_health",
              "_ocv2_group_consecutive",
              "_ocv2_inventory_from_file",
              "_ocv2_polygon_for_group",
              "_ocv2_slot_positions",
              "_tc_quitar_nombre_motor_del_analisis",
              "_tg_clean_indices",
              "_tg_norm_to_px",
          ]
          missing = [
              name for name in required
              if not callable(getattr(terracore_engine, name, None))
          ]
          if missing:
              raise SystemExit("Faltan funciones del motor: " + ", ".join(missing))

          os.environ["TERRACORE_LANGUAGE"] = "ES"
          assert terracore_engine.tr("Español", "Français") == "Español"
          os.environ["TERRACORE_LANGUAGE"] = "FR"
          assert terracore_engine.tr("Español", "Français") == "Français"

          assert callable(appsheet_process_analysis)

          # La validación de AppSheet debe conservar la geometría original
          # y aplicar los extremos/conteos corregidos antes del análisis de Salud.
          geometry = {
              "id": 1,
              "points_norm": [[100.0, 100.0], [100.0, 260.0], [100.0, 420.0],
                              [100.0, 580.0], [100.0, 740.0], [100.0, 900.0]],
              "slot_count": 4,
              "vacant_indices": [2],
              "row_spacing_px": 18.0,
              "slot_pitch_px": 10.0,
              "confidence": 0.8,
              "slot_confidence": 0.7,
          }
          edited_record = {
              "geometriajson": json.dumps(geometry),
              "numerosurco": "01",
              "slots": "4",
              "ocupados": "3",
              "vacios": "1",
              "vaciosindices": "3",
              "puntoiniciox": "120",
              "puntoinicioy": "100",
              "puntofinx": "120",
              "puntofiny": "900",
          }
          edited_row = _apply_inventory_record_edits(edited_record)
          assert edited_row["id"] == 1
          assert edited_row["slot_count"] == 4
          assert edited_row["vacant_indices"] == [3]
          assert edited_row["manual_position"] is True
          assert edited_row["points_norm"][0] == [120.0, 100.0]
          assert edited_row["points_norm"][-1] == [120.0, 900.0]

          invalid_record = dict(edited_record)
          invalid_record["ocupados"] = "2"
          try:
              _apply_inventory_record_edits(invalid_record)
          except ValueError:
              pass
          else:
              raise AssertionError("Se aceptó un inventario donde Slots != Ocupados + Vacíos.")

          rendered = terracore_engine._ocv2_render_inventory_with_rows(
              Image.new("RGB", (100, 80), (80, 100, 80)),
              [edited_row],
          )
          assert rendered.size == (100, 126)

          print("OK: motor TerraCore e integración AppSheet importan correctamente.")
          print("OK: funciones requeridas y selección ES/FR verificadas.")
          print("OK: 100 zonas se guardan en una sola escritura y no se duplican.")
          print("OK: correcciones manuales de geometría y validación de inventario verificadas.")
          print("OK: render del Inventario corregido verificado.")
          PY
